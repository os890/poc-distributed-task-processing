quarkus.application.name=trade-app
quarkus.banner.enabled=false

# single node with an in-memory database (dev, tests)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:trade;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
quarkus.hibernate-orm.schema-management.strategy=update

# dtp: all settings have defaults, the namespace defaults to the application name
dtp.poll-interval=200ms
dtp.housekeeping-interval=500ms
dtp.heartbeat-interval=1s
dtp.lease-duration=5s
dtp.leader-lease-duration=3s
dtp.dead-after=10s

quarkus.log.category."org.os890.dtp".level=INFO

# the parallel checks of a valid trade: trades above the limit need an approval, restricted ISINs are rejected
trade.approval.quantity-limit=1000000
trade.compliance.restricted-isins=AT0000000007

# Markdown with a Mermaid diagram per flow, generated from the DB after the start
%dev.dtp.flows.export=mermaid
%test.dtp.flows.export=mermaid
%cluster.dtp.flows.export=mermaid
%cluster.dtp.flows.export-path=cluster-data/dtp-flows.md

# cluster profile: several instances on one H2 server (see run-cluster.sh)
%cluster.quarkus.datasource.jdbc.url=jdbc:h2:tcp://localhost:${h2.port:9092}/./trade;LOCK_TIMEOUT=10000
%cluster.quarkus.datasource.jdbc.max-size=30
%cluster.trade.enrichment.delay=PT0.05S

%test.quarkus.jacoco.data-file=jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
%test.dtp.poll-interval=50ms
%test.dtp.housekeeping-interval=100ms
%test.dtp.definition-refresh=100ms
