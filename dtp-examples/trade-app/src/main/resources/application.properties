quarkus.application.name=trade-app
quarkus.banner.enabled=false

# single node with an in-memory database (dev, tests)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:trade;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
quarkus.hibernate-orm.schema-management.strategy=update

# dtp: all settings have defaults, the namespace defaults to the application name
dtp.poll-interval=200ms
dtp.housekeeping-interval=500ms
dtp.heartbeat-interval=1s
dtp.lease-duration=5s
dtp.leader-lease-duration=3s
dtp.dead-after=10s

quarkus.log.category."org.os890.dtp".level=INFO

# the parallel checks of a valid trade: trades above the limit need an approval, restricted ISINs are rejected
trade.approval.quantity-limit=1000000
trade.compliance.restricted-isins=AT0000000007

# delay of the approval reminder, a placeholder of the job definitions (V2__approval_reminder.sql)
dtp.definitions.placeholders.approval-reminder-after=PT4H
%test.dtp.definitions.placeholders.approval-reminder-after=PT1S
%cluster.dtp.definitions.placeholders.approval-reminder-after=PT30S

# the end of day starts at 18:00 (Vienna) on each business day of AT-BANKING (V4__business_calendar.sql), tests start
# it via REST only; the cluster demo tries every minute: one end of day per business date all the same
dtp.definitions.placeholders.eod-cron=0 0 18 ? * *
%test.dtp.definitions.placeholders.eod-cron=NONE
%cluster.dtp.definitions.placeholders.eod-cron=0 * * ? * *
trade.eod.calendar=AT-BANKING

# processing slot of the enrichment: the market data is available on business days from 07:00 to 22:00 (Vienna);
# tests and the cluster demo use the whole day without calendar (NONE), the demo overrides it with system properties
dtp.definitions.placeholders.market-data-calendar=AT-BANKING
dtp.definitions.placeholders.market-data-from=07:00:00
dtp.definitions.placeholders.market-data-to=22:00:00
%test.dtp.definitions.placeholders.market-data-calendar=NONE
%test.dtp.definitions.placeholders.market-data-from=00:00:00
%test.dtp.definitions.placeholders.market-data-to=00:00:00
%cluster.dtp.definitions.placeholders.market-data-calendar=NONE
%cluster.dtp.definitions.placeholders.market-data-from=00:00:00
%cluster.dtp.definitions.placeholders.market-data-to=00:00:00

# settlement export after the sign-off: one file per custodian, a rejected file is sent again after the backoff
trade.settlement.package-size=500
dtp.definitions.placeholders.settlement-retry-backoff=PT5M
%test.dtp.definitions.placeholders.settlement-retry-backoff=PT0.5S
%cluster.dtp.definitions.placeholders.settlement-retry-backoff=PT10S
%cluster.trade.settlement.package-size=100
%cluster.trade.settlement.send-delay=PT1S
# acknowledgements of the settlement files (slice 14): the simulated custodians answer after the delay; a file without
# answer within the timeout counts as rejected and is sent again
trade.settlement.ack-delay=PT1S
%test.trade.settlement.ack-delay=PT0.1S
%cluster.trade.settlement.ack-delay=PT2S
dtp.definitions.placeholders.settlement-ack-timeout=PT10M
%test.dtp.definitions.placeholders.settlement-ack-timeout=PT1S
%cluster.dtp.definitions.placeholders.settlement-ack-timeout=PT20S

# regulatory trade report (V7__trade_reporting.sql): a collection window that pauses the enrichment, daily at 17:30
# (Vienna) on the business days of AT-BANKING; tests start it via REST only, the cluster demo every two minutes
dtp.definitions.placeholders.reporting-cron=0 30 17 ? * *
dtp.definitions.placeholders.reporting-calendar=AT-BANKING
dtp.definitions.placeholders.reporting-quiesce-timeout=PT15M
%test.dtp.definitions.placeholders.reporting-cron=NONE
%test.dtp.definitions.placeholders.reporting-calendar=NONE
%test.dtp.definitions.placeholders.reporting-quiesce-timeout=PT10S
%cluster.dtp.definitions.placeholders.reporting-cron=0 */2 * ? * *
%cluster.dtp.definitions.placeholders.reporting-calendar=NONE
%cluster.dtp.definitions.placeholders.reporting-quiesce-timeout=PT1M

# monitoring read model (heat map, live feed): the leader of the role "projection" projects the views every 10 s
# (defaults); tests and the cluster demo project faster, and the demo counts a trade waiting 30 s as a jam
%test.dtp.monitoring.interval=200ms
%test.dtp.monitoring.failure-threshold=3
%test.dtp.monitoring.failure-window=2s
%test.dtp.monitoring.feed-interval=200ms
%cluster.dtp.monitoring.interval=2s
%cluster.dtp.monitoring.expected-max-queue-age=30s
%cluster.dtp.monitoring.failure-window=1m
%cluster.dtp.monitoring.feed-interval=1s

# Markdown with a Mermaid diagram per flow, generated from the DB after the start
%dev.dtp.flows.export=mermaid
%test.dtp.flows.export=mermaid
%cluster.dtp.flows.export=mermaid
%cluster.dtp.flows.export-path=cluster-data/dtp-flows.md

# cluster profile: several instances on one H2 server (see run-cluster.sh)
%cluster.quarkus.datasource.jdbc.url=jdbc:h2:tcp://localhost:${h2.port:9092}/./trade;LOCK_TIMEOUT=10000
%cluster.quarkus.datasource.jdbc.max-size=30
%cluster.trade.enrichment.delay=PT0.05S
%cluster.trade.eod.report-delay=PT3S

%test.quarkus.jacoco.data-file=jacoco.exec
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.report=false
%test.dtp.poll-interval=50ms
%test.dtp.housekeeping-interval=100ms
%test.dtp.definition-refresh=100ms
# a free port for the tests: 8081 may be taken by another local service
%test.quarkus.http.test-port=0
