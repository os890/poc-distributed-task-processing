1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="132.9453" x="425.9605" y="24.0669">if one lane is empty,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="174.0464" x="405.41" y="39.1997">the other gets every batch</text></g></g></svg>