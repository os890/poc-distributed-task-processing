<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="201px" preserveAspectRatio="none" style="width:592px;height:201px;background:#FFFFFF;" version="1.1" viewBox="0 0 592 201" width="592px" zoomAndPan="magnify"><defs/><g><!--cluster INBOX--><g class="cluster" data-qualified-name="INBOX" data-source-line="18" id="ent0002"><rect fill="#FBFBFB" height="185" rx="4" ry="4" style="stroke:#999999;stroke-width:1;" width="302" x="7" y="10.13"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="286.3809" x="14.8096" y="24.1969">Inbox of any job, e.g. AvailabilityCheck</text></g><!--entity VQ--><g class="entity" data-qualified-name="INBOX.VQ" data-source-line="19" id="ent0003"><rect fill="#EEF3FB" height="50.2656" rx="4" ry="4" style="stroke:#4A6FA5;stroke-width:0.5;" width="160.353" x="77.32" y="44"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="52.5142" x="87.32" y="66.0669">VIP lane</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="140.353" x="87.32" y="81.1997">priority 100, weight 3</text></g><!--entity SQ--><g class="entity" data-qualified-name="INBOX.SQ" data-source-line="20" id="ent0004"><rect fill="#EEF3FB" height="50.2656" rx="4" ry="4" style="stroke:#4A6FA5;stroke-width:0.5;" width="143.811" x="85.59" y="129"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="104.7046" x="95.59" y="151.0669">STANDARD lane</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="123.811" x="95.59" y="166.1997">priority 0, weight 1</text></g><!--entity RUN--><g class="entity" data-qualified-name="RUN" data-source-line="22" id="ent0005"><rect fill="#EEF3FB" height="50.2656" rx="4" ry="4" style="stroke:#4A6FA5;stroke-width